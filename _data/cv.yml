experience:
  - org: "Électricité de France (EDF R&D)"
    role: "Senior engineer and researcher"
    when: "1997 – present"
    items:
      - "**Smoothed Particle Hydrodynamics (SPH):** turbulence models, boundary conditions, numerical stability, time-marching schemes, incompressibility, software development, multi-physics, real-world applications."
      - "**Turbulence:** explicit algebraic stress models, stochastic processes, passive and active scalar diffusion, numerical modelling."
      - "**Water waves:** spectral waves, dynamics of tsunamis, nonlinear dispersive waves, channel waves, storm surges."
      - "**Design of water works:** coastal dykes, dam spillways, scale models."
      - "**Miscellaneous:** coastal engineering, sediment transport, coastal flooding, climate change, oil spills, algal blooms, frazil ice, grid clogging, porous media, statistics of extreme events, etc."
      - "**Project management:** leader of several local, national and European projects."
      - "**Team management:** teams of about 10 people, young and experienced fellows."
  - org: "Saint-Venant Laboratory for Hydraulics (LHSV)"
    role: "Senior researcher"
    when: "2006 – present"
    items:
