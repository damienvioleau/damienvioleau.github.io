<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="{{ site.url }}/">
  <meta property="og:image" content="{{ site.url }}/{{ site.data.profile.photo }}">
  <link rel="canonical" href="{{ site.url }}/">
  {% if site.google_site_verification != "" %}<meta name="google-site-verification" content="{{ site.google_site_verification }}">{% endif %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.data.profile.name }}",
    "url": "{{ site.url }}/",
    "image": "{{ site.url }}/{{ site.data.profile.photo }}",
    "jobTitle": "{{ site.data.profile.title }}",
    "email": "mailto:{{ site.data.profile.email }}",
    "affiliation": [{% for a in site.data.profile.affiliations %}{"@type": "Organization", "name": {{ a.name | jsonify }}}{% unless forloop.last %}, {% endunless %}{% endfor %}],
    "knowsAbout": {{ site.data.profile.research_interests | jsonify }},
    "sameAs": [{% assign first = true %}{% for l in site.data.profile.links %}{% if l.url != "" %}{% unless first %}, {% endunless %}"{{ l.url }}"{% assign first = false %}{% endif %}{% endfor %}]
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
{{ content }}
<script src="assets/js/site.js"></script>
{% if site.goatcounter %}<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>{% endif %}
</body>
</html>
